[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yaskawa-socket-programming"
version = "0.2.0"
description = "CSV command validation, timed playback and a local robotics messaging demo"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Himanshu Yadav"}]
dependencies = ["yaskawa-json-to-ros>=0.2.0,<0.3"]

[project.scripts]
yaskawa-playback = "csv_ros_tcp_processor.main:main"
yaskawa-demo = "csv_ros_tcp_processor.demo:main"

[tool.setuptools.packages.find]
include = ["csv_ros_tcp_processor*"]
